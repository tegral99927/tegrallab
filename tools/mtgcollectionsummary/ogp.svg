<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#1e1633"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Glowing background elements -->
  <circle cx="950" cy="180" r="240" fill="#4f46e5" opacity="0.25" filter="url(#glow)"/>
  <circle cx="100" cy="500" r="200" fill="#f59e0b" opacity="0.15" filter="url(#glow)"/>

  <!-- Right side mockup card -->
  <g transform="translate(820, 100)">
    <rect width="310" height="440" rx="16" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="2"/>
    <rect x="15" y="15" width="280" height="410" rx="12" fill="none" stroke="#e2b714" stroke-width="1.5" opacity="0.8"/>
    
    <text x="30" y="50" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff">MTG Collection &amp; Deck</text>
    <text x="30" y="74" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#e2b714">Magic: The Gathering</text>
    
    <!-- Mini Card Art box -->
    <rect x="30" y="90" width="250" height="150" rx="8" fill="rgba(79, 70, 229, 0.2)" stroke="rgba(255, 255, 255, 0.1)"/>
    <circle cx="155" cy="165" r="35" fill="none" stroke="#e2b714" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="155" y="172" font-family="'Segoe UI', sans-serif" font-size="28" fill="#ffffff" text-anchor="middle">🔮</text>

    <!-- Mana Curve Bars -->
    <g transform="translate(30, 260)">
      <text x="0" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">MANA CURVE</text>
      <!-- Bars -->
      <rect x="10" y="100" width="28" height="40" rx="4" fill="#38bdf8"/>
      <rect x="48" y="55" width="28" height="85" rx="4" fill="#818cf8"/>
      <rect x="86" y="25" width="28" height="115" rx="4" fill="#c084fc"/>
      <rect x="124" y="45" width="28" height="95" rx="4" fill="#f472b6"/>
      <rect x="162" y="80" width="28" height="60" rx="4" fill="#fb7185"/>
      <rect x="200" y="105" width="28" height="35" rx="4" fill="#34d399"/>
    </g>
  </g>

  <!-- Left Content -->
  <!-- Tagline -->
  <text x="75" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#e2b714" letter-spacing="1.5">🔮 TEGRAL LAB / MAGIC: THE GATHERING SUITE</text>

  <!-- Title -->
  <text x="75" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">MTGCollectionSummary</text>

  <!-- Accent Line -->
  <rect x="75" y="175" width="450" height="4" rx="2" fill="url(#goldGrad)"/>

  <!-- Subtitle -->
  <text x="75" y="220" font-family="'Segoe UI', 'Hiragino Kaku Gothic ProN', sans-serif" font-size="22" font-weight="bold" fill="#cbd5e1">MTG コレクション管理 ＆ デッキ統合スイート</text>

  <!-- Feature Pills -->
  <g transform="translate(75, 255)">
    <!-- Item 1 -->
    <g transform="translate(0, 0)">
      <rect width="690" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">📦 コレクション管理・所持数・市場資産評価（Foil/版別対応）</text>
    </g>
    <!-- Item 2 -->
    <g transform="translate(0, 52)">
      <rect width="690" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">🎴 統率者(EDH) / スタンダード / モダン等 全フォーマット構築</text>
    </g>
    <!-- Item 3 -->
    <g transform="translate(0, 104)">
      <rect width="690" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">📊 マナカーブ＆超幾何分布分析・サマリーPDF/印刷出力</text>
    </g>
    <!-- Item 4 -->
    <g transform="translate(0, 156)">
      <rect width="690" height="42" rx="8" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)"/>
      <text x="20" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#ffffff">⇄ Arena / Moxfield / 晴れる屋形式の高速インポート・照合</text>
    </g>
    <!-- Item 5 -->
    <g transform="translate(0, 208)">
      <rect width="690" height="42" rx="8" fill="rgba(79, 70, 229, 0.2)" stroke="rgba(79, 70, 229, 0.5)"/>
      <text x="20" y="27" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#a5b4fc">⚡ 完全無料・ローカルデータ保存（外部送信なしで安心管理）</text>
    </g>
  </g>

  <!-- Footer link -->
  <text x="75" y="585" font-family="'Segoe UI', sans-serif" font-size="13" fill="#64748b">https://tegrallab.com/tools/mtgcollectionsummary/ | Powered by Scryfall API</text>
</svg>
