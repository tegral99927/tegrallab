<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="starGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffe699"/>
      <stop offset="60%" stop-color="#c9933b"/>
      <stop offset="100%" stop-color="#7a4e15"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background circular wood token -->
  <circle cx="64" cy="64" r="60" fill="#2b1a0e" stroke="#c9933b" stroke-width="4"/>
  <circle cx="64" cy="64" r="54" fill="#432814" stroke="#7a4e15" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- 6-Point Sheriff Star -->
  <g filter="url(#shadow)">
    <polygon points="64,16 77,44 107,35 94,64 115,86 85,89 77,118 64,95 44,114 47,85 16,80 37,58 24,31 53,40"
             fill="url(#starGrad)" stroke="#432814" stroke-width="2"/>
    <!-- Center disk with W -->
    <circle cx="64" cy="64" r="18" fill="#2b1a0e" stroke="#c9933b" stroke-width="2"/>
    <text x="64" y="72" font-family="Georgia, serif" font-weight="900" font-size="20" fill="#ffe699" text-anchor="middle">W</text>
  </g>
</svg>
