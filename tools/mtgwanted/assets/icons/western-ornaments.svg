      <circle cx="20" cy="20" r="4" fill="#8c2a1c"/>
      <circle cx="45" cy="45" r="3" fill="#8c2a1c"/>
    </g>
    <g id="westernDivider">
      <path d="M 0,10 L 150,10 M 250,10 L 400,10" stroke="#4a2e12" stroke-width="2"/>
      <polygon points="200,2 205,8 212,8 206,12 208,18 200,14 192,18 194,12 188,8 195,8" fill="#8c2a1c"/>
      <circle cx="175" cy="10" r="2.5" fill="#4a2e12"/>
