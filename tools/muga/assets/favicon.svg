<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <rect width="512" height="512" fill="#090a0d" rx="96" />
  <defs>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.01" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ensoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#d4d7de" stop-opacity="0.75" />
      <stop offset="90%" stop-color="#989ca8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="210" fill="url(#softGlow)" />
  <!-- Enso: Unclosed mindful circle -->
  <path d="M 256 86 
           A 170 170 0 1 1 130 142" 
        fill="none" 
        stroke="url(#ensoGrad)" 
        stroke-width="14" 
        stroke-linecap="round" />
  <!-- Subtle inner echo dot/breath mark -->
  <circle cx="256" cy="256" r="3.5" fill="#e2e5ec" opacity="0.6" />
</svg>
