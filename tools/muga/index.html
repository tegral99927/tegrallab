<body>
  <!-- Ambient Breathing Light Glow -->
  <div class="ambient-glow" aria-hidden="true"></div>

  <!-- Screen Reader Live Region -->
  <div id="live-status" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <!-- Header / Navigation -->
  <header class="app-header">
    <a href="/pages/tools.html" class="back-link" title="ツール一覧へ戻る">
      <span aria-hidden="true">←</span>
      <span>Tegral Lab</span>
    </a>
    <span class="app-indicator" aria-hidden="true">Mindful Stillness</span>
  </header>

  <!-- Main Experience Stage -->
  <main class="main-stage">
    <!-- Emblem: Unclosed Enso Circle -->
    <div class="enso-container" id="enso-wrapper" aria-hidden="true">
      <svg class="enso-svg" viewBox="0 0 512 512" width="100%" height="100%">
        <defs>
          <linearGradient id="ensoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
            <stop offset="70%" stop-color="#cfd2dc" stop-opacity="0.65" />
            <stop offset="100%" stop-color="#808492" stop-opacity="0.15" />
          </linearGradient>
        </defs>
        <path d="M 256 86 A 170 170 0 1 1 130 142" fill="none" stroke="url(#ensoGlow)" stroke-width="12"
          stroke-linecap="round" />
        <circle cx="256" cy="256" r="3" fill="#e2e5ec" opacity="0.6" />
      </svg>
    </div>

    <!-- Scene 1: Standby (Initial State) -->
    <section id="scene-idle" class="scene active" aria-labelledby="app-heading">
      <h1 id="app-heading" class="app-title">Muga</h1>
      <p class="app-subtext">ただ、音に身を委ねる。</p>

      <button id="play-btn" class="primary-btn" type="button" aria-label="音楽の再生を開始する">
        <span>音を聴く</span>
      </button>

      <div class="guidance-box" aria-label="体験のご案内">
        <p class="guidance-text">心地よい姿勢になり、目を閉じてください。</p>
        <p class="guidance-text">何かを感じようとする必要はありません。</p>
      </div>
    </section>

    <!-- Scene 2: Playing State -->
    <section id="scene-playing" class="scene" aria-hidden="true" aria-live="polite">
      <h2 class="playing-message">目を閉じて、ただ音に身を委ねてください。</h2>
      <p class="playing-submessage">何もしなくて大丈夫です。</p>

      <div class="playing-controls" aria-label="再生コントロール">
        <button id="pause-resume-btn" class="control-btn" type="button" aria-label="音楽を一時停止" title="一時停止">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            <rect x="14" y="4" width="4" height="16" rx="1"></rect>
          </svg>
        </button>

        <button id="stop-btn" class="control-btn" type="button" aria-label="音楽を停止する" title="停止">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
          </svg>
        </button>
      </div>
    </section>

    <!-- Scene 3: Ended State (Stillness) -->
    <section id="scene-ended" class="scene" aria-hidden="true" aria-live="polite">
      <h2 class="ended-message">音が終わりました。</h2>
      <p class="ended-submessage">この静けさも、そのままに。</p>

      <button id="replay-btn" class="primary-btn" type="button" aria-label="もう一度、ランダムに音楽を再生する">
        <span>もう一度、音に委ねる</span>
      </button>
    </section>

    <!-- Quiet Volume Controls (Shared across states, visually minimal) -->
    <div class="volume-panel" aria-label="音量設定">
      <button id="mute-btn" class="volume-icon-btn" type="button" aria-label="音声をミュート" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
        </svg>
      </button>
      <input type="range" id="volume-slider" class="volume-slider" min="0" max="100" value="80"
        aria-label="マスター音量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
    </div>
  </main>

  <!-- Notification Toast -->
  <aside id="message-toast" class="message-toast" role="status" aria-live="polite"></aside>

  <!-- Subtle Minimal Footer -->
  <footer class="app-footer">
    <p>Muga &mdash; Nothing to achieve. Simply surrender to sound.</p>
  </footer>

  <!-- Core Script -->
  <script src="script.js"></script>
</body>
