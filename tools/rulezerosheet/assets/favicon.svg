<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f6d365"/>
      <stop offset="100%" stop-color="#fda085"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243b55"/>
      <stop offset="100%" stop-color="#141e30"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#d4af37" stroke-width="8" stroke-opacity="0.3"/>

  <!-- Left: MTG Card Shape -->
  <g transform="translate(64, 96)">
    <rect width="180" height="260" rx="16" fill="url(#cardGrad)" stroke="#d4af37" stroke-width="6"/>
    <!-- Card Inner Frame -->
    <rect x="16" y="16" width="148" height="100" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <!-- Emblem / Mana Orb in Card Art -->
    <circle cx="90" cy="66" r="28" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <path d="M90 46 L96 66 L90 86 L84 66 Z" fill="#f59e0b"/>
    <!-- Card Text Lines -->
    <rect x="20" y="130" width="140" height="12" rx="4" fill="#94a3b8"/>
    <rect x="20" y="152" width="140" height="8" rx="3" fill="#64748b"/>
    <rect x="20" y="168" width="110" height="8" rx="3" fill="#64748b"/>
    <rect x="20" y="184" width="80" height="8" rx="3" fill="#64748b"/>
  </g>

  <!-- Right: Rule 0 Sheet & Checklist -->
  <g transform="translate(230, 140)">
    <!-- Sheet Paper -->
    <rect width="218" height="276" rx="14" fill="#ffffff" stroke="#38bdf8" stroke-width="6" filter="drop-shadow(0 12px 24px rgba(0,0,0,0.5))"/>
    <!-- Sheet Header -->
    <rect x="20" y="24" width="130" height="18" rx="4" fill="#0f172a"/>
    <rect x="160" y="20" width="38" height="24" rx="6" fill="#8b5cf6"/>

    <!-- Checklist Rows -->
    <!-- Row 1: Bracket Tag -->
    <rect x="20" y="60" width="178" height="32" rx="6" fill="#f1f5f9"/>
    <circle cx="36" cy="76" r="8" fill="#10b981"/>
    <rect x="54" y="70" width="90" height="12" rx="3" fill="#334155"/>

    <!-- Row 2: Features -->
    <rect x="20" y="104" width="178" height="32" rx="6" fill="#f1f5f9"/>
    <circle cx="36" cy="120" r="8" fill="#3b82f6"/>
    <rect x="54" y="114" width="110" height="12" rx="3" fill="#334155"/>

    <!-- Row 3: Combos -->
    <rect x="20" y="148" width="178" height="32" rx="6" fill="#f1f5f9"/>
    <circle cx="36" cy="164" r="8" fill="#f59e0b"/>
    <rect x="54" y="158" width="80" height="12" rx="3" fill="#334155"/>

    <!-- Row 4: Preferences -->
    <rect x="20" y="192" width="178" height="32" rx="6" fill="#f1f5f9"/>
    <circle cx="36" cy="208" r="8" fill="#ef4444"/>
    <rect x="54" y="202" width="100" height="12" rx="3" fill="#334155"/>

    <!-- Footer stamp -->
    <rect x="20" y="238" width="60" height="16" rx="4" fill="#cbd5e1"/>
  </g>

  <!-- Big Glowing "0" Seal in center corner -->
  <g transform="translate(190, 220)">
    <circle cx="48" cy="48" r="44" fill="#0c1017" stroke="#d4af37" stroke-width="8"/>
    <text x="48" y="62" font-family="-apple-system, sans-serif" font-weight="900" font-size="44" fill="#f6d365" text-anchor="middle">0</text>
  </g>
</svg>
